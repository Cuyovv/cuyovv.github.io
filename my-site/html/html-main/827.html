<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌌 Space Clicker Achievements 🚀</title>
<style>
  body {
    font-family: 'Orbitron', sans-serif;
    text-align: center;
    background: radial-gradient(circle at bottom, #0b0c2a 0%, #000 80%);
    color: #00eaff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    overflow: hidden;
  }

  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
  }

  h1 { 
	font-size: 2.5em; 
	  text-shadow: 0 0 10px #00eaff; 
	  margin:10px 0;}
  #score { 
	  font-size: 2em; margin: 5px; }
  #multiplierDisplay { 
	  font-size: 1.1em; color: #a0ffea; 
		  margin-bottom: 15px;
			}

  #clickButton {
    padding: 20px 40px; font-size: 1.5em; background: linear-gradient(90deg, #00d4ff, #0090ff);
    color: white; border: none; border-radius: 50px; cursor: pointer;
    margin-bottom: 20px; box-shadow: 0 0 15px #00d4ff; transition: transform 0.1s ease, background 0.2s;
  }
  #clickButton:hover { background: linear-gradient(90deg, #00b7ff, #0070ff); }
  #clickButton:active { transform: scale(0.95); }

  .shop, #cosmicShop {
    display: flex; flex-direction: column; gap: 10px; align-items: center;
    background: rgba(255, 255, 255, 0.05); padding: 20px 20px; border-radius: 15px;
    width: 280px; border: 1px solid rgba(0, 212, 255, 0.3); max-height: 350px; overflow-y: auto;
  }
  .shop::-webkit-scrollbar, #cosmicShop::-webkit-scrollbar { width: 8px; }
  .shop::-webkit-scrollbar-thumb, #cosmicShop::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.3); border-radius: 5px; }

  .upgrade { width: 100%; padding: 10px; font-size: 1em; border: none; border-radius: 10px; cursor: pointer; background: rgba(0,212,255,0.2); color:#fff; transition: background 0.2s, transform 0.1s; }
  .upgrade:hover { background: rgba(0,212,255,0.35); }
  .upgrade:disabled { background: rgba(255,255,255,0.1); color: #666; cursor:not-allowed; }

  #prestigeButton {
    margin-top: 15px; padding: 15px 25px; background: radial-gradient(circle, #ff008c, #9b00ff);
    border: none; border-radius: 12px; color:white; font-size:1.2em; cursor:pointer; transition: all 0.3s; box-shadow:0 0 20px #ff00b8;
  }
  #prestigeButton:hover { transform: scale(1.1); box-shadow:0 0 30px #ff00e6; }
  #prestigeButton.locked { opacity:0.4; box-shadow:none; cursor:not-allowed; }

  .save-buttons { position: fixed; top:10px; left:10px; display:flex; flex-direction:column; z-index: 10;}
  .save-buttons button { margin:5px; padding:8px 15px; border:none; border-radius:8px; cursor:pointer; background: rgba(0,212,255,0.2); color:#fff; font-weight:bold; transition:background 0.2s; }
  .save-buttons button:hover { background: rgba(0,212,255,0.4); }

  #achievementsPanel {
    position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.6); padding: 15px;
    border-radius: 10px; width: 240px; max-height: 400px; overflow-y: auto; color: #00eaff; z-index: 10;
  }
  #achievementsPanel h3 { margin-top:0; font-size:1.2em; text-shadow:0 0 5px #00eaff; }
  .achievement { margin: 5px 0; padding: 5px; border-bottom:1px solid rgba(0,212,255,0.2); font-size:0.95em; }
  .unlocked { color:#fff; font-weight:bold; text-shadow: 0 0 5px #00eaff; }

  #shopsContainer { display:flex; gap: 20px; justify-content:center; margin-bottom:20px; flex-wrap:wrap; }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<h1>🌠 Space Clicker 🌠</h1>
<div id="score">0 Stardust</div>
<div id="multiplierDisplay">Cosmic Cores: 0 | Multiplier: x1.00</div>
<button id="clickButton">Collect Stardust ✨</button>

<div id="shopsContainer">
  <div class="shop" id="stardustShop">
    <h3>🪐 Galactic Shop</h3>
    <button class="upgrade" id="upgradeClick">Upgrade Glove (+1/click) — Cost: 50 — Owned: 0</button>
    <button class="upgrade" id="buyAuto">Buy Drone (+1/sec) — Cost: 100 — Owned: 0</button>
    <button class="upgrade" id="buySuperAuto">Deploy Super Drone (+5/sec) — Cost: 500 — Owned: 0</button>
    <button class="upgrade" id="buyMine">Build Space Mine (+20/sec) — Cost: 2000 — Owned: 0</button>
    <button class="upgrade" id="buyBlackHole">Create Black Hole Generator (+100/sec) — Cost: 10000 — Owned: 0</button>
    <button class="upgrade" id="buyPlanet">Construct Planetary Factory (+500/sec) — Cost: 50000 — Owned: 0</button>
    <button class="upgrade" id="buyMoon">Establish Moon Colony (+2000/sec) — Cost: 200000 — Owned: 0</button>
    <button class="upgrade" id="buyForge">Forge Star Factory (+10000/sec) — Cost: 1000000 — Owned: 0</button>
    <button class="upgrade" id="buyDyson">Build Dyson Sphere (+100000/sec) — Cost: 10000000 — Owned: 0</button>
    <button class="upgrade" id="buyCore">Activate Galactic Core (+1,000,000/sec) — Cost: 100000000 — Owned: 0</button>
  </div>

  <div class="shop" id="cosmicShop" style="display:none">
    <h3>🌌 Cosmic Shop</h3>
    <button class="upgrade" id="buyLunar">Lunar Eclipse (+200M/sec) — Cost: 5 Cores — Owned: 0</button>
    <button class="upgrade" id="buyLauncher">Cosmic Launcher (+500M/sec) — Cost: 10 Cores — Owned: 0</button>
    <button class="upgrade" id="buyWhiteHole">White Hole (+600M/sec) — Cost: 15 Cores — Owned: 0</button>
    <button class="upgrade" id="buyShark">Cosmic Shark (+5B/sec) — Cost: 50 Cores — Owned: 0</button>
    <button class="upgrade" id="buyWrongUniverse">Wrong Universe (+8B/sec) — Cost: 100 Cores — Owned: 0</button>
  </div>
</div>

<button id="prestigeButton" class="locked">Ascend for Cosmic Power 🔮</button>

<div class="save-buttons">
  <button id="saveGame">💾 Save</button>
  <button id="resetGame">🗑️ Reset</button>
</div>

<div id="achievementsPanel">
  <h3>🏆 Achievements</h3>
  <div id="achievementsList"></div>
</div>

<script>
// CORE VARIABLES
let score = 0, clickPower = 1, upgradeCost = 50, cosmicCores = 0, multiplier = 1;
let prestigeThreshold = 1_000_000_000 * multiplier;

// Stardust shop items
const items = [
  {id:"buyAuto", name:"Drone", gain:1, cost:100, costMult:1.8},
  {id:"buySuperAuto", name:"Super Drone", gain:5, cost:500, costMult:2},
  {id:"buyMine", name:"Space Mine", gain:20, cost:2000, costMult:2.3},
  {id:"buyBlackHole", name:"Black Hole Generator", gain:100, cost:10000, costMult:2.8},
  {id:"buyPlanet", name:"Planetary Factory", gain:500, cost:50000, costMult:3},
  {id:"buyMoon", name:"Moon Colony", gain:2000, cost:200000, costMult:3.2},
  {id:"buyForge", name:"Star Forge", gain:10000, cost:1000000, costMult:3.5},
  {id:"buyDyson", name:"Dyson Sphere", gain:100000, cost:10000000, costMult:3.8},
  {id:"buyCore", name:"Galactic Core", gain:1000000, cost:100000000, costMult:4.2}
];
const counts = {}; items.forEach(i=>counts[i.id]=0);

// Cosmic shop items
const cosmicItems = [
  {id:"buyLunar", name:"Lunar Eclipse", gain:100_000_000, cost:1, count:0},
  {id:"buyLauncher", name:"Cosmic Launcher", gain:500_000_000, cost:10, count:0},
  {id:"buyWhiteHole", name:"White Hole", gain:600_000_000, cost:15, count:0},
  {id:"buyShark", name:"Cosmic Shark", gain:5_000_000_000, cost:50, count:0},
  {id:"buyWrongUniverse", name:"Wrong Universe", gain:8_000_000_000, cost:100, count:0}
];

// ACHIEVEMENTS
const achievements=[
  {id:"firstClick", name:"First Click", desc:"Click the Stardust button once.", condition:()=>score>=1, unlocked:false},
  {id:"stardust1k", name:"1k Stardust", desc:"Accumulate 1,000 Stardust.", condition:()=>score>=1000, unlocked:false},
  {id:"stardust1M", name:"1M Stardust", desc:"Accumulate 1,000,000 Stardust.", condition:()=>score>=1e6, unlocked:false},
  {id:"own10Drones", name:"Drone Commander", desc:"Own 10 Drones.", condition:()=>counts["buyAuto"]>=10, unlocked:false},
  {id:"fakeStars", name:"Fake stars aren't as bright", desc:"Own 10 Star Forge.", condition:()=>counts["buyForge"]>=10, unlocked:false},
  {id:"cosmicShark", name:"Welcome to the new beginning", desc:"Buy the Cosmic Shark.", condition:()=>cosmicItems.find(i=>i.id==="buyShark").count>=1, unlocked:false},
  {id:"wrongWay", name:"Sorry wrong way", desc:"Buy the Wrong Universe.", condition:()=>cosmicItems.find(i=>i.id==="buyWrongUniverse").count>=1, unlocked:false},
  {id:"godsNightmare", name:"God's worst nightmare", desc:"Buy 10 Cosmic Sharks.", condition:()=>cosmicItems.find(i=>i.id==="buyShark").count>=10, unlocked:false},
  {id:"firstPrestige", name:"First Ascension", desc:"Ascend once.", condition:()=>cosmicCores>=1, unlocked:false},
  {id:"CosmicDis", name:"Cosmic Discoverys", desc:"Buy 10 Black Hole Generators.", condition:()=>counts["buyBlackHole"]>=10, unlocked:false}
];

// DOM ELEMENTS
const scoreDisplay=document.getElementById("score");
const clickButton=document.getElementById("clickButton");
const upgradeClick=document.getElementById("upgradeClick");
const prestigeButton=document.getElementById("prestigeButton");
const multiplierDisplay=document.getElementById("multiplierDisplay");
const saveButton=document.getElementById("saveGame");
const resetButton=document.getElementById("resetGame");
const achievementsList=document.getElementById("achievementsList");
const cosmicShopDiv=document.getElementById("cosmicShop");

// CLICK HANDLERS
clickButton.addEventListener("click", ()=>{
  score += clickPower*multiplier;
  updateDisplay();
  checkAchievements();
});

upgradeClick.addEventListener("click", ()=>{
  if(score>=upgradeCost){
    score -= upgradeCost;
    clickPower++;
    updateDisplay();
    checkAchievements();
    upgradeCost = Math.floor(upgradeCost * 1.75);
  }
});

items.forEach(item=>{
  document.getElementById(item.id).addEventListener("click",()=>{
    if(score>=item.cost){
      score -= item.cost;
      counts[item.id]++;
      item.cost = Math.floor(item.cost*item.costMult);
      updateDisplay();
      checkAchievements();
    }
  });
});

cosmicItems.forEach(item=>{
  document.getElementById(item.id).addEventListener("click", ()=>{
    if(cosmicCores>=item.cost){
      cosmicCores -= item.cost;
      item.count++;
      updateDisplay();
      checkAchievements();
    }
  });
});

// AUTO GAIN
function getAutoGain(){
  let sum = items.reduce((a,i)=>a+counts[i.id]*i.gain,0)*multiplier;
  let cosmicSum = cosmicItems.reduce((a,i)=>a+i.count*i.gain,0);
  return sum+cosmicSum;
}
setInterval(()=>{score += getAutoGain(); updateDisplay(); checkAchievements();},1000);

// PRESTIGE
function prestige(){
  if(score>=prestigeThreshold) {
	const earnedCores=Math.floor(score/prestigeThreshold);
    cosmicCores += earnedCores;
    multiplier = 1 + cosmicCores*0.1;
    alert(`Ascension Complete! 🌌 You gained ${earnedCores} Cosmic Cores!\nMultiplier is now x${multiplier.toFixed(2)}\nCost for Next is ${prestigeThreshold}.`);
    score=0; clickPower=1; upgradeCost=50;
    items.forEach(i=>i.cost=i.gain*100);
    Object.keys(counts).forEach(k=>counts[k]=0);
    updateDisplay();
	 checkAchievements();
    saveGame();
  }
}

// UPDATE DISPLAY
function updateDisplay(){
  scoreDisplay.textContent=`${Math.floor(score).toLocaleString()} Stardust`;
  multiplierDisplay.textContent=`Cosmic Cores: ${cosmicCores} | Multiplier: x${multiplier.toFixed(2)}`;
  prestigeButton.classList.toggle("locked", score<prestigeThreshold);

  upgradeClick.textContent = `Upgrade Glove (+1/click) — Cost: ${upgradeCost} — Owned: ${clickPower-1}`;
  upgradeClick.disabled = score<upgradeCost;

  items.forEach(i=>{
    const btn = document.getElementById(i.id);
    btn.disabled = score<i.cost;
    btn.textContent=`${i.name} (+${i.gain}/sec) — Cost: ${i.cost} — Owned: ${counts[i.id]}`;
  });

  cosmicItems.forEach(i=>{
    const btn=document.getElementById(i.id);
    btn.textContent=`${i.name} (+${i.gain.toLocaleString()}/sec) — Cost: ${i.cost} Cores — Owned: ${i.count}`;
    btn.disabled = cosmicCores<i.cost;
  });

  cosmicShopDiv.style.display = cosmicCores >= 1 ? "flex" : "none";

  updateAchievementsUI();
}

// SAVE & LOAD
function saveGame(){
  localStorage.setItem("spaceClickerAchievements", JSON.stringify({score, clickPower, upgradeCost, cosmicCores, multiplier, items, counts, cosmicItems, achievements}));
}
function loadGame(){
  const saved=JSON.parse(localStorage.getItem("spaceClickerAchievements"));
  if(saved){
    score=saved.score||0;
    clickPower=saved.clickPower||1;
    upgradeCost=saved.upgradeCost||50;
    cosmicCores=saved.cosmicCores||0;
    multiplier=saved.multiplier||1;
    Object.assign(counts,saved.counts||{});
    if(saved.items) saved.items.forEach((s,i)=>items[i].cost=s.cost);
    if(saved.cosmicItems) saved.cosmicItems.forEach((s,i)=>cosmicItems[i].count=s.count);
    if(saved.achievements) saved.achievements.forEach((a,i)=>achievements[i].unlocked=a.unlocked);
    updateDisplay();
  }
}
resetButton.addEventListener("click", ()=>{if(confirm("Reset all progress?")){localStorage.removeItem("spaceClickerAchievements"); location.reload();}});
saveButton.addEventListener("click", saveGame);
prestigeButton.addEventListener("click", prestige);
setInterval(saveGame,10000);

// ACHIEVEMENTS
function checkAchievements(){
  achievements.forEach(a=>{
    if(!a.unlocked && a.condition()){
      a.unlocked=true;
      alert(`Achievement Unlocked: ${a.name} 🎉\n${a.desc}`);
    }
  });
}
function updateAchievementsUI(){
  achievementsList.innerHTML="";
  achievements.forEach(a=>{
    achievementsList.innerHTML+=`<div class="achievement ${a.unlocked?'unlocked':''}">${a.name}</div>`;
  });
}

// LOAD GAME
loadGame();
updateDisplay();

// STARFIELD BACKGROUND
const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
window.addEventListener("resize", ()=>{canvas.width=window.innerWidth; canvas.height=window.innerHeight;});
const starsArray=Array.from({length:200},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,size:Math.random()*2+0.5,speed:Math.random()*0.5+0.2}));
function animateStars(){
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#00eaff";
  starsArray.forEach(s=>{
    s.y+=s.speed;
    if(s.y>canvas.height){s.y=0; s.x=Math.random()*canvas.width;}
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
    ctx.fill();
  });
  requestAnimationFrame(animateStars);
}
animateStars();
</script>
</body>
</html>
