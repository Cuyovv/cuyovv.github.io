<!DOCTYPE html>
<html>
<head>
    <title>Games</title>
    <style>
        body { background:#111; color:#fff; font-family:Arial; padding:20px; }
        h1 { color:#4af; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; }
        a { background:#222; color:#4af; padding:15px; border-radius:8px; text-align:center; text-decoration:none; display:block; font-size:13px; }
        a:hover { background:#333; }
    </style>
</head>
<body>
    <h1>Games</h1>
    <p id="status" style="color:#888">Loading game names...</p>
    <div class="grid" id="grid"></div>
    <script>
        const grid = document.getElementById('grid');
        const status = document.getElementById('status');
        const total = 825;

        async function loadGame(n) {
            try {
                const res = await fetch('/html/html-main/' + n + '.html');
                if (!res.ok) return;
                const text = await res.text();
                const match = text.match(/<title>(.*?)<\/title>/i);
                const a = document.createElement('a');
                a.href = '/html/html-main/' + n + '.html';
                a.textContent = match ? match[1] : 'Game ' + n;
                grid.appendChild(a);
            } catch {
                // file doesn't exist, skip it
            }
        }

        async function loadAll() {
            for (let i = 0; i <= total; i += 10) {
                const batch = [];
                for (let j = i; j < i + 10 && j <= total; j++) batch.push(j);
                await Promise.all(batch.map(loadGame));
                status.textContent = `Loading... ${Math.min(i+10, total)} / ${total}`;
            }
            status.textContent = 'All games loaded!';
        }
        loadAll();
    </script>
</body>
</html>
