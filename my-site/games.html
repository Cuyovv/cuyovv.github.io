<!DOCTYPE html>
<html>
<head>
    <title>Games</title>
    <style>
        body { background:#111; color:#fff; font-family:Arial; padding:20px; }
        h1 { color:#4af; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
        a {
            background:#222; color:#fff; padding:10px;
            border-radius:10px; text-align:center;
            text-decoration:none; display:block;
            font-size:12px; transition:background 0.2s;
        }
        a:hover { background:#333; }
        a img {
            width:100%; aspect-ratio:16/9;
            object-fit:cover; border-radius:6px;
            margin-bottom:6px; background:#333;
        }
        a .no-cover {
            width:100%; aspect-ratio:16/9;
            background:#2a2a2a; border-radius:6px;
            margin-bottom:6px; display:flex;
            align-items:center; justify-content:center;
            color:#555; font-size:11px;
        }
    </style>
</head>
<body>
    <h1>Games</h1>
    <p id="status" style="color:#888">Loading games...</p>
    <div class="grid" id="grid"></div>
    <script>
        const grid = document.getElementById('grid');
        const status = document.getElementById('status');
        const total = 825;

        async function loadGame(n) {
            try {
                const res = await fetch('/html/html-main/' + n + '.html');
                if (!res.ok) return;
                const text = await res.text();
                const match = text.match(/<title>(.*?)<\/title>/i);
                const name = match ? match[1] : 'Game ' + n;

                const a = document.createElement('a');
                a.href = '/html/html-main/' + n + '.html';

                const img = document.createElement('img');
                img.src = '/covers/covers-main/' + n + '.png';
                img.alt = name;
                img.onerror = function() {
                    this.outerHTML = '<div class="no-cover">No Cover</div>';
                };

                const label = document.createElement('div');
                label.textContent = name;

                a.appendChild(img);
                a.appendChild(label);
                grid.appendChild(a);
            } catch {
                // skip
            }
        }

        async function loadAll() {
            for (let i = 0; i <= total; i += 10) {
                const batch = [];
                for (let j = i; j < i + 10 && j <= total; j++) batch.push(j);
                await Promise.all(batch.map(loadGame));
                status.textContent = `Loading... ${Math.min(i+10, total)} / ${total}`;
            }
            status.textContent = 'All games loaded!';
        }
        loadAll();
    </script>
</body>
</html>
